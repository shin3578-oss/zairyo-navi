<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="材料ナビ">
<title>材料ナビ</title>
<style>
:root{
  --bg:#f6f7f7;--card:#fff;--ink:#1c2526;--sub:#5d6b6c;--line:#dfe5e5;
  --accent:#0f766e;--accent-ink:#fff;--soft:#e6f3f1;--warn:#b45309;--warn-soft:#fef3c7;
  --ci:#d9480f;--feed:#1d4ed8;--dealer:#7c3aed;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#101515;--card:#182020;--ink:#e7eeee;--sub:#9aabab;--line:#2a3535;
  --accent:#2dd4bf;--accent-ink:#06201d;--soft:#163230;--warn:#fbbf24;--warn-soft:#3a2d0c;
  --ci:#fb923c;--feed:#60a5fa;--dealer:#c4b5fd;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h1 small{font-weight:normal;color:var(--sub);font-size:12px;margin-left:auto}
.search{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
.search:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--sub);cursor:pointer;position:relative}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button[aria-current=true]{color:var(--accent);font-weight:bold}
.badge{position:absolute;top:4px;left:55%;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
main{padding:12px 16px 96px;max-width:760px;margin:0 auto}
.meta{color:var(--sub);font-size:13px;margin:4px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h3{font-size:16px;margin:0 0 2px;word-break:break-word}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--sub);font-size:13px}
.vtag{display:inline-block;font-size:12px;font-weight:bold;padding:1px 8px;border-radius:6px;border:1px solid currentColor}
.v-ci{color:var(--ci)}.v-feed{color:var(--feed)}.v-dealer{color:var(--dealer)}
.memo{background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin-top:8px;font-size:14px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:bold}
.btn.small{padding:5px 10px;font-size:13px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.item{display:flex;gap:12px}
.item .body{flex:1;min-width:0}
.thumb{flex:none;width:76px;height:76px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:zoom-in}
.thumb.none{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:11px;background:var(--bg);cursor:default}
.ctag{font-size:12px;color:var(--sub)}
.subhead{font-size:13px;font-weight:bold;color:var(--sub);margin:16px 2px 8px}
.viewbar{display:flex;gap:6px;align-items:center;margin:2px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;text-align:left;font-size:12px;line-height:1.35}
.tile img,.tile .ph{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:8px;display:block;margin-bottom:4px}
.tile .ph{display:flex;align-items:center;justify-content:center;color:var(--sub);background:var(--bg)}
.shot{display:flex;gap:10px;align-items:center;margin-top:6px}
.shot img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#bigImg{max-width:100%;max-height:80vh;display:block;margin:0 auto;background:#fff}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea.f{min-height:90px}
.note-open{border-left:4px solid var(--warn)}
.status{font-size:12px;font-weight:bold}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog h2{font-size:17px;margin:0 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
#gate{max-width:360px;margin:20vh auto;padding:0 16px;text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="gate" class="hidden">
  <h1 style="justify-content:center">材料ナビ</h1>
  <p class="meta">院内の材料・消耗品の注文先を探すページです。</p>
  <form id="gateForm">
    <input class="f" id="gKey" type="password" placeholder="合言葉" autocomplete="current-password" required>
    <input class="f" id="gName" placeholder="名前（記録に残ります）" style="margin-top:8px" required>
    <button class="btn main" style="margin-top:12px;width:100%;justify-content:center">はじめる</button>
    <p id="gErr" class="meta" style="color:var(--warn)"></p>
  </form>
</div>

<div id="app" class="hidden">
<header>
  <h1>材料ナビ <small id="who"></small></h1>
  <input id="q" class="search" type="search" placeholder="品名・商品コード・キーワードで探す" autocomplete="off" enterkeyhint="search">
  <div class="chips" id="vchips"></div>
  <div class="chips" id="cchips"></div>
</header>

<main>
  <section id="tab-search">
    <div class="viewbar"><button class="chip" id="vList" aria-pressed="true">リスト</button><button class="chip" id="vGrid" aria-pressed="false">写真で見る</button><span class="meta" id="count" style="margin:0 0 0 6px"></span></div>
    <div id="list"></div>
  </section>

  <section id="tab-new" class="hidden">
    <div class="card">
      <h3>新しく入ったもの・変わったことを残す</h3>
      <p class="meta" style="margin:0">新しい材料や機材が入った、注文先が変わった、などをメモしてください。あとで事務スタッフが台帳に取り込みます。</p>
      <form id="noteForm">
        <label>種別</label>
        <select class="f" id="nKind"><option>新規入荷</option><option>新規導入（機材）</option><option>注文先の変更</option><option>在庫・使い方のメモ</option><option>その他</option></select>
        <label>品名（わかる範囲で）</label>
        <input class="f" id="nName" required>
        <label>どこから来たか（業者）</label>
        <input class="f" id="nVendor" list="vendorNames" placeholder="Ci・FEED・ケーオーデンタル など">
        <label>内容（商品コード・規格・値段・置き場所・誰が使うか など）</label>
        <textarea class="f" id="nBody"></textarea>
        <label>写真（箱やラベルを撮っておくと、あとで探しやすくなります）</label>
        <div class="shot"><input type="file" accept="image/*" capture="environment" id="nPhotoFile"><img id="nPhotoPrev" class="hidden" alt=""></div>
        <input type="hidden" id="nPhoto">
        <button class="btn main" style="margin-top:12px">残す</button>
      </form>
    </div>
    <div class="meta">まだ台帳に取り込んでいないメモ</div>
    <div id="notesOpen"></div>
    <details><summary class="meta">取り込み済みのメモ</summary><div id="notesDone"></div></details>
  </section>

  <section id="tab-vendors" class="hidden">
    <div id="vendorList"></div>
    <button class="btn" id="addVendor">＋ 注文先を足す</button>
  </section>
</main>

<nav>
  <button data-tab="search" aria-current="true"><b>🔍</b>さがす</button>
  <button data-tab="new"><b>📝</b>新しく入った<span class="badge hidden" id="nBadge"></span></button>
  <button data-tab="vendors"><b>📞</b>注文先</button>
</nav>
</div>

<datalist id="vendorNames"></datalist>

<dialog id="itemDlg"><form method="dialog" id="itemForm">
  <h2 id="itemTitle">品目を編集</h2>
  <label>品名</label><input class="f" name="品名" required>
  <label>キーワード（呼び名・略称など。検索に効きます）</label><input class="f" name="キーワード">
  <div class="grid2">
    <div><label>業者</label><input class="f" name="業者" list="vendorNames" required></div>
    <div><label>商品コード</label><input class="f" name="商品コード"></div>
    <div><label>規格</label><input class="f" name="規格"></div>
    <div><label>単価（円）</label><input class="f" name="単価" inputmode="numeric"></div>
    <div><label>分類</label><input class="f" name="分類" list="catNames"></div>
    <div><label>最終購入日</label><input class="f" name="最終購入日" placeholder="2026-10-08"></div>
  </div>
  <label>商品ページURL（空なら業者の書式から自動で作ります）</label><input class="f" name="URL" inputmode="url">
  <label>写真</label>
  <div class="shot"><input type="file" accept="image/*" capture="environment" id="iPhotoFile"><img id="iPhotoPrev" class="hidden" alt=""></div>
  <input type="hidden" name="写真">
  <label>メモ</label><textarea class="f" name="メモ"></textarea>
  <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="非表示"> もう使わない（検索に出さない）</label>
  <div class="acts"><button class="btn main" value="save">保存</button><button class="btn" value="cancel" formnovalidate>やめる</button></div>
</form></dialog>
<datalist id="catNames"></datalist>

<dialog id="vendorDlg"><form method="dialog" id="vendorForm">
  <h2>注文先</h2>
  <div class="grid2">
    <div><label>業者</label><input class="f" name="業者" required></div>
    <div><label>種別</label><select class="f" name="種別"><option>通販</option><option>ディーラー</option><option>技工所</option><option>その他</option></select></div>
    <div><label>担当者</label><input class="f" name="担当者"></div>
    <div><label>電話</label><input class="f" name="電話" inputmode="tel"></div>
    <div><label>メール</label><input class="f" name="メール" inputmode="email"></div>
    <div><label>FAX</label><input class="f" name="FAX" inputmode="tel"></div>
  </div>
  <label>LINEのトークURL（公式LINEのチャット画面のURL）</label><input class="f" name="LINE" inputmode="url">
  <label>注文方法（例：担当に電話／訪問時に渡す／サイトで注文）</label><input class="f" name="注文方法">
  <label>商品URLの書式（{code} が商品コードに置き換わります）</label><input class="f" name="商品URL" inputmode="url">
  <label>検索URLの書式（{q} が品名に置き換わります）</label><input class="f" name="検索URL" inputmode="url">
  <label>メモ</label><textarea class="f" name="メモ"></textarea>
  <div class="acts"><button class="btn main" value="save">保存</button><button class="btn" value="cancel" formnovalidate>やめる</button></div>
</form></dialog>

<dialog id="viewDlg"><form method="dialog" style="padding:12px"><div id="viewBody"></div><div class="acts"><button class="btn" value="close">閉じる</button></div></form></dialog>
<dialog id="imgDlg"><form method="dialog" style="padding:8px"><img id="bigImg" alt=""><div class="acts"><button class="btn" value="close">閉じる</button></div></form></dialog>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbytWsBvMXPg4qlNlpFjumLe5WzSD96RV4lG6JUARsk3Gy6Li5MCKrrpOacbYMrua7aQ/exec';
const LS = {get:k=>{try{return localStorage.getItem('zn_'+k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem('zn_'+k,v)}catch(e){}}};
let KEY = LS.get('key'), NAME = LS.get('name');
let DB = {items:[],vendors:[],notes:[]};
let vFilter = '', cFilter = '', view = 'list', editingNote = null;
const CATS = ['麻酔・注射','感染対策・消毒','グローブ・マスク・ガウン','滅菌・洗浄','切削・バー・ポイント','根管治療','修復・接着','印象・模型','補綴・仮歯','外科・インプラント・縫合','歯周・予防・PMTC','矯正','物販・口腔ケア用品','器具・小物','ユニット・機械部品','X線・撮影','衛生材料・ディスポ','薬品・医薬品','技工','事務・日用品','その他'];
const PHOTO = {};  // photo:<id> → data URL
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 半角カナ・全角英数・ひらがなの違いを無視して探せるようにする
function norm(s){
  return String(s||'').normalize('NFKC').toLowerCase()
    .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60))
    .replace(/[\s\-‐ー－・\/()（）]/g,'');
}

// GETで送る（POSTはGoogle側の転送で中身が落ちることがあるため）。読むだけの list は1回だけやり直す。
async function api(action, extra={}){
  const u = API + '?' + new URLSearchParams({key:KEY||'', action, by:NAME||'', payload:JSON.stringify(extra)});
  for(let n=0;;n++){
    try{
      const res = await fetch(u);
      const j = await res.json();
      if(!j.ok) throw new Error(j.error || '失敗しました');
      return j;
    }catch(err){ if(action!=='list' || n>=1) throw err; }
  }
}

// 写真だけはURLに入らない大きさなのでPOST。中身が落ちて「合言葉が違います」が返ったときは何も書かれていないので、やり直してよい
async function apiPost(action, extra={}){
  let last;
  for(let n=0;n<4;n++){
    try{
      const res = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({key:KEY, action, by:NAME}, extra))});
      const j = await res.json();
      if(j.ok) return j;
      last = new Error(j.error||'失敗しました');
      if(!j.debug) throw last;
    }catch(err){ last = err; }
  }
  throw last;
}

// スマホの写真を縮小（長い辺640px・1枚およそ35KB以下）
function shrink(file){
  return new Promise((ok, ng) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      for(const side of [640, 520, 420]){
        const r = Math.min(1, side/Math.max(w,h)); const c = document.createElement('canvas');
        c.width = Math.round(w*r); c.height = Math.round(h*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        for(const q of [0.72,0.6,0.5,0.4]){ const d = c.toDataURL('image/jpeg', q); if(d.length < 45000){ URL.revokeObjectURL(url); return ok(d); } }
      }
      ng(new Error('写真が大きすぎます'));
    };
    img.onerror = () => ng(new Error('写真を読めませんでした'));
    img.src = url;
  });
}

async function uploadPhoto(input, prev, hidden){
  const f = input.files && input.files[0]; if(!f) return;
  busy('写真を送っています…');
  try{
    const d = await shrink(f);
    const r = await apiPost('addPhoto', {data:d});
    PHOTO['photo:'+r.id] = d; hidden.value = 'photo:'+r.id; prev.src = d; prev.classList.remove('hidden'); toast('写真を付けました');
  }catch(err){ toast(err.message); }
}

function photoSrc(v){ if(!v) return ''; if(v.startsWith('photo:')) return PHOTO[v] || ''; return v; }
// スタッフが撮った写真は、表示するときに1枚ずつ取りに行く
async function fillPhotos(root){
  for(const el of root.querySelectorAll('img[data-pid]')){
    const id = el.dataset.pid;
    if(!PHOTO[id]){ try{ PHOTO[id] = (await api('photo',{id:id.slice(6)})).data; }catch(e){ continue; } }
    el.src = PHOTO[id]; el.removeAttribute('data-pid');
  }
}
function imgTag(v, cls){
  if(!v) return '';
  const src = photoSrc(v);
  return src ? `<img class="${cls}" loading="lazy" src="${esc(src)}" alt="" data-big="1">`
             : `<img class="${cls}" loading="lazy" alt="" data-pid="${esc(v)}" data-big="1">`;
}

function busy(m){const t=$('#toast');clearTimeout(t._h);t.textContent=m;t.classList.add('show')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

async function load(){
  $('#count').textContent = '読み込み中…';
  const j = await api('list');
  DB = j;
  DB.items.forEach(it => it._n = norm([it['品名'],it['キーワード'],it['商品コード'],it['規格'],it['分類'],it['業者'],it['メモ']].join(' ')));
  try{ localStorage.setItem('zn_cache', JSON.stringify({items:DB.items,vendors:DB.vendors,notes:DB.notes})) }catch(e){}
  renderAll();
}

function vendorOf(name){ return DB.vendors.find(v => v['業者'] === name) || {'業者':name}; }
function vclass(v){ const n=v['業者']||''; return /ci|歯愛/i.test(n)?'v-ci':/feed|フィード/i.test(n)?'v-feed':'v-dealer'; }

function itemUrl(it){
  if(it['URL']) return it['URL'];
  const v = vendorOf(it['業者']);
  if(it['商品コード'] && v['商品URL']) return v['商品URL'].replace('{code}', encodeURIComponent(it['商品コード']));
  if(v['検索URL']) return v['検索URL'].replace('{q}', encodeURIComponent(it['品名']));
  return '';
}

// 注文文。LINEはURLで本文を渡せないので、ボタンを押したときに写しておく（トークで貼り付けるだけ）
function orderText(it, v){
  const who = v['担当者'] ? String(v['担当者']).replace(/（.*?）/,'').replace(/さん$/,'').trim() + ' 様\n' : '';
  return `${who}下記の注文をお願いします。\n品名：${it['品名']}${it['商品コード']?'\n商品コード：'+it['商品コード']:''}${it['規格']?'\n規格：'+it['規格']:''}\n数量：`;
}

function actions(it){
  const v = vendorOf(it['業者']); const out = [];
  const url = itemUrl(it);
  if(url) out.push(`<a class="btn main" href="${esc(url)}" target="_blank" rel="noopener">🛒 ${esc(v['業者'])}で開く</a>`);
  if(v['LINE']) out.push(`<a class="btn${url?'':' main'}" href="${esc(v['LINE'])}" target="_blank" rel="noopener" data-copy="${esc(orderText(it,v))}">💬 LINEで注文</a>`);
  if(v['電話']) out.push(`<a class="btn" href="tel:${esc(v['電話'].replace(/[^\d+]/g,''))}">📞 ${esc(v['担当者']||'電話')}</a>`);
  if(v['メール']) {
    const sub = encodeURIComponent('注文のお願い（大崎オーバルコート歯科・矯正歯科室）');
    const body = encodeURIComponent(orderText(it,v) + `\n\n医療法人社団KDS 大崎オーバルコート歯科・矯正歯科室\n${NAME||''}`);
    out.push(`<a class="btn" href="mailto:${esc(v['メール'])}?subject=${sub}&body=${body}">✉️ メールで注文</a>`);
  }
  out.push(`<button class="btn small" data-edit="${esc(it.id)}">✏️ 直す</button>`);
  return out.join('');
}

function grams(w){ const g=[]; for(let i=0;i<w.length-1;i++) g.push(w.slice(i,i+2)); return g.length?g:[w]; }
// あいまい一致：入力した言葉の2文字の組が、品目にどれだけ含まれるか（言い間違い・うろ覚え向け）
function fuzzyScore(it, words){
  let t = 0;
  for(const w of words){ const g = grams(w); t += g.filter(x => it._n.includes(x)).length / g.length; }
  return t / words.length;
}

function card(it){
  const v = vendorOf(it['業者']);
  return `<div class="card"><div class="item">
    ${it['写真'] ? imgTag(it['写真'],'thumb') : '<div class="thumb none">写真なし</div>'}
    <div class="body">
      <h3>${esc(it['品名'])}</h3>
      <div class="row"><span class="vtag ${vclass(v)}">${esc(it['業者'])}</span>
        ${it['分類']?`<span class="ctag">${esc(it['分類'])}</span>`:''}
        ${it['規格']?`<span>${esc(it['規格'])}</span>`:''}
        ${it['単価']?`<span>¥${Number(String(it['単価']).replace(/,/g,'')).toLocaleString()}</span>`:''}
        ${it['商品コード']?`<span>コード ${esc(it['商品コード'])}</span>`:''}
        ${it['最終購入日']?`<span>最終 ${esc(it['最終購入日'])}</span>`:''}</div>
    </div></div>
    ${it['メモ']?`<div class="memo">${esc(it['メモ'])}</div>`:''}
    <div class="acts">${actions(it)}</div></div>`;
}

function tile(it){
  const pic = it['写真'] ? imgTag(it['写真'],'').replace(' data-big="1"','') : '<div class="ph">写真なし</div>';
  return `<button class="tile" data-view="${esc(it.id)}">${pic}${esc(it['品名'])}</button>`;
}

function renderSearch(){
  const words = $('#q').value.normalize('NFKC').split(/\s+/).map(norm).filter(Boolean);
  let base = DB.items.filter(it => !it['非表示'] || it['非表示']==='FALSE');
  if(vFilter) base = base.filter(it => it['業者'] === vFilter);
  if(cFilter) base = base.filter(it => it['分類'] === cFilter);
  const byDate = (a,b) => (b['最終購入日']||'').localeCompare(a['最終購入日']||'');
  const hit = words.length ? base.filter(it => words.every(w => it._n.includes(w))) : base.slice();
  hit.sort(byDate);
  // ぴったりが少ないときは、似ている品目も出す
  let near = [];
  if(words.length && hit.length < 8){
    const got = new Set(hit.map(i=>i.id));
    near = base.filter(it => !got.has(it.id)).map(it => [it, fuzzyScore(it, words)])
      .filter(([,sc]) => sc >= 0.5).sort((a,b) => b[1]-a[1]).slice(0, 30).map(([it]) => it);
  }
  const limit = view==='grid' ? 120 : 80;
  const shown = hit.slice(0, limit);
  $('#count').textContent = `${hit.length}件` + (hit.length>shown.length ? `（新しく買った順に${shown.length}件）` : '') + (near.length ? `／似ているもの ${near.length}件` : '');
  const draw = arr => view==='grid' ? `<div class="grid">${arr.map(tile).join('')}</div>` : arr.map(card).join('');
  let html = draw(shown);
  if(near.length) html += `<div class="subhead">もしかして（言葉が近いもの）</div>` + draw(near);
  if(!shown.length && !near.length) html = `<div class="empty">見つかりませんでした。<br>使い道の言葉（例：麻酔、仮歯、手袋）や、上の分類からも探せます。<br>台帳に無いものは「新しく入った」からメモしてください。<br><br>${searchOut()}</div>`;
  $('#list').innerHTML = html;
  fillPhotos($('#list'));
}

// 台帳に無いとき：通販サイトで同じ言葉を探すボタン
function searchOut(){
  const q = $('#q').value.trim(); if(!q) return '';
  return DB.vendors.filter(v => v['検索URL']).map(v =>
    `<a class="btn" href="${esc(v['検索URL'].replace('{q}',encodeURIComponent(q)))}" target="_blank" rel="noopener">${esc(v['業者'])}で「${esc(q)}」を探す</a>`).join(' ');
}

function renderChips(){
  const counts = {}; DB.items.forEach(it => counts[it['業者']] = (counts[it['業者']]||0)+1);
  const names = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  $('#vchips').innerHTML = [`<button class="chip" data-v="" aria-pressed="${!vFilter}">すべて</button>`]
    .concat(names.map(n => `<button class="chip" data-v="${esc(n)}" aria-pressed="${vFilter===n}">${esc(n)} ${counts[n]}</button>`)).join('');
  const all = new Set(names.concat(DB.vendors.map(v=>v['業者'])));
  $('#vendorNames').innerHTML = [...all].map(n=>`<option value="${esc(n)}">`).join('');
  $('#catNames').innerHTML = CATS.map(n=>`<option value="${esc(n)}">`).join('');
  const cc = {}; DB.items.forEach(it => { if(it['分類']) cc[it['分類']] = (cc[it['分類']]||0)+1; });
  $('#cchips').innerHTML = [`<button class="chip" data-c="" aria-pressed="${!cFilter}">分類：すべて</button>`]
    .concat(CATS.filter(c=>cc[c]).map(c => `<button class="chip" data-c="${esc(c)}" aria-pressed="${cFilter===c}">${esc(c)} ${cc[c]}</button>`)).join('');
}

function noteCard(n, open){
  return `<div class="card ${open?'note-open':''}">
    <div class="row"><span class="status" style="color:${open?'var(--warn)':'var(--sub)'}">${esc(n['状態'])}</span><span>${esc(n['種別'])}</span><span>${esc(n['日時'])}</span><span>${esc(n['投稿者'])}</span></div>
    <h3>${esc(n['品名'])}</h3>
    ${n['業者']?`<div class="row">業者：${esc(n['業者'])}</div>`:''}
    ${n['内容']?`<div class="memo">${esc(n['内容'])}</div>`:''}
    ${n['写真']?`<div style="margin-top:8px">${imgTag(n['写真'],'thumb')}</div>`:''}
    ${open?`<div class="acts"><button class="btn main small" data-take="${esc(n.id)}">台帳に取り込む</button><button class="btn small" data-close="${esc(n.id)}">取り込まずに閉じる</button></div>`
          :(n['対応者']?`<div class="row" style="margin-top:6px">${esc(n['対応日'])} ${esc(n['対応者'])}</div>`:'')}
  </div>`;
}

function renderNotes(){
  const open = DB.notes.filter(n => n['状態']==='未反映').reverse();
  const done = DB.notes.filter(n => n['状態']!=='未反映').reverse().slice(0,50);
  $('#notesOpen').innerHTML = open.map(n=>noteCard(n,true)).join('') || '<div class="empty">取り込み待ちはありません</div>';
  $('#notesDone').innerHTML = done.map(n=>noteCard(n,false)).join('');
  fillPhotos($('#notesOpen'));
  $('#nBadge').textContent = open.length; $('#nBadge').classList.toggle('hidden', !open.length);
}

function renderVendors(){
  const counts = {}; DB.items.forEach(it => counts[it['業者']] = (counts[it['業者']]||0)+1);
  $('#vendorList').innerHTML = DB.vendors.map(v => `<div class="card">
    <h3><span class="vtag ${vclass(v)}">${esc(v['種別']||'')}</span> ${esc(v['業者'])}</h3>
    <div class="row">${v['担当者']?`<span>担当：${esc(v['担当者'])}</span>`:''}${v['注文方法']?`<span>${esc(v['注文方法'])}</span>`:''}<span>台帳 ${counts[v['業者']]||0}品目</span></div>
    ${v['メモ']?`<div class="memo">${esc(v['メモ'])}</div>`:''}
    <div class="acts">
      ${v['LINE']?`<a class="btn main" href="${esc(v['LINE'])}" target="_blank" rel="noopener">💬 LINE</a>`:''}
      ${v['電話']?`<a class="btn${v['LINE']?'':' main'}" href="tel:${esc(v['電話'].replace(/[^\d+]/g,''))}">📞 ${esc(v['電話'])}</a>`:''}
      ${v['メール']?`<a class="btn" href="mailto:${esc(v['メール'])}">✉️ メール</a>`:''}
      ${v['FAX']?`<span class="btn small">FAX ${esc(v['FAX'])}</span>`:''}
      ${v['検索URL']?`<a class="btn" href="${esc(v['検索URL'].replace('{q}',''))}" target="_blank" rel="noopener">🌐 サイト</a>`:''}
      <button class="btn small" data-vedit="${esc(v['業者'])}">✏️ 直す</button>
    </div></div>`).join('');
}

function renderAll(){ renderChips(); renderSearch(); renderNotes(); renderVendors(); }

function openItem(it, title){
  const f = $('#itemForm'); f.reset(); f.dataset.id = it.id || '';
  $('#itemTitle').textContent = title || '品目を編集';
  [...f.elements].forEach(el => { if(!el.name) return; if(el.type==='checkbox') el.checked = !!it[el.name] && it[el.name]!=='FALSE'; else el.value = it[el.name] || ''; });
  const pv = $('#iPhotoPrev'); pv.classList.toggle('hidden', !it['写真']); pv.removeAttribute('src');
  if(it['写真']){ const src = photoSrc(it['写真']); if(src) pv.src = src; else { pv.dataset.pid = it['写真']; fillPhotos(pv.parentElement); } }
  $('#itemDlg').showModal();
}

// ---- イベント ----
$('#q').addEventListener('input', renderSearch);
$('#vchips').addEventListener('click', e => { const b=e.target.closest('.chip'); if(!b) return; vFilter=b.dataset.v; renderChips(); renderSearch(); });
$('#cchips').addEventListener('click', e => { const b=e.target.closest('.chip'); if(!b) return; cFilter=b.dataset.c; renderChips(); renderSearch(); });
['List','Grid'].forEach(k => $('#v'+k).addEventListener('click', () => { view = k.toLowerCase(); $('#vList').setAttribute('aria-pressed', view==='list'); $('#vGrid').setAttribute('aria-pressed', view==='grid'); renderSearch(); }));
$('#nPhotoFile').addEventListener('change', e => uploadPhoto(e.target, $('#nPhotoPrev'), $('#nPhoto')));
$('#iPhotoFile').addEventListener('change', e => uploadPhoto(e.target, $('#iPhotoPrev'), $('#itemForm').elements['写真']));
document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-current', x===b));
  ['search','new','vendors'].forEach(t => $('#tab-'+t).classList.toggle('hidden', t!==b.dataset.tab));
  document.querySelectorAll('header .chips').forEach(x => x.classList.toggle('hidden', b.dataset.tab!=='search'));
  $('#q').classList.toggle('hidden', b.dataset.tab!=='search');
  window.scrollTo(0,0);
});
document.addEventListener('click', e => {
  const big = e.target.closest('img[data-big]');
  if(big && big.src){ $('#bigImg').src = big.src; $('#imgDlg').showModal(); return; }
  const tl = e.target.closest('[data-view]');
  if(tl){ const it = DB.items.find(i=>i.id===tl.dataset.view); $('#viewBody').innerHTML = card(it); fillPhotos($('#viewBody')); $('#viewDlg').showModal(); return; }
  const c = e.target.closest('[data-copy]');
  if(c){ try{ navigator.clipboard.writeText(c.dataset.copy).then(()=>toast('注文文を写しました。トークに貼り付けて数量を入れてください')); }catch(err){} return; }
  const t = e.target.closest('[data-edit],[data-take],[data-close],[data-vedit],#addVendor'); if(!t) return;
  if(t.dataset.edit){ openItem(DB.items.find(i=>i.id===t.dataset.edit)); }
  else if(t.dataset.take){ const n=DB.notes.find(x=>x.id===t.dataset.take); editingNote=n;
    openItem({'品名':n['品名'],'業者':n['業者'],'メモ':n['内容'],'写真':n['写真'],'最終購入日':(n['日時']||'').slice(0,10)}, '台帳に取り込む'); }
  else if(t.dataset.close){ busy('閉じています…'); api('resolveNote',{id:t.dataset.close,status:'取り込まず'}).then(load).then(()=>toast('閉じました')).catch(err=>toast(err.message)); }
  else if(t.dataset.vedit || t.id==='addVendor'){ const v=DB.vendors.find(x=>x['業者']===t.dataset.vedit)||{};
    const f=$('#vendorForm'); f.reset(); [...f.elements].forEach(el=>{ if(el.name) el.value=v[el.name]||(el.tagName==='SELECT'?el.options[0].value:''); }); $('#vendorDlg').showModal(); }
});
$('#itemForm').addEventListener('submit', async e => {
  if(!e.submitter || e.submitter.value!=='save'){ editingNote=null; return; }
  const f=$('#itemForm'); const data={id:f.dataset.id||undefined};
  [...f.elements].forEach(el => { if(el.name) data[el.name] = el.type==='checkbox' ? (el.checked?'TRUE':'') : el.value.trim(); });
  busy('保存中…');
  try{
    await api('saveItem',{data, noteId: editingNote ? editingNote.id : ''});
    editingNote=null; await load(); toast('保存しました');
  }catch(err){ toast(err.message); }
});
$('#vendorForm').addEventListener('submit', async e => {
  if(!e.submitter || e.submitter.value!=='save') return;
  const data={}; [...$('#vendorForm').elements].forEach(el=>{ if(el.name) data[el.name]=el.value.trim(); });
  busy('保存中…');
  try{ await api('saveVendor',{data}); await load(); toast('保存しました'); }catch(err){ toast(err.message); }
});
$('#noteForm').addEventListener('submit', async e => {
  e.preventDefault();
  const data = {'投稿者':NAME,'種別':$('#nKind').value,'品名':$('#nName').value.trim(),'業者':$('#nVendor').value.trim(),'内容':$('#nBody').value.trim(),'写真':$('#nPhoto').value};
  busy('送っています…');
  try{ await api('addNote',{data}); e.target.reset(); $('#nPhoto').value=''; $('#nPhotoPrev').classList.add('hidden'); await load(); toast('残しました。ありがとうございます'); }catch(err){ toast(err.message); }
});
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault(); KEY=$('#gKey').value.trim(); NAME=$('#gName').value.trim();
  try{ await load(); LS.set('key',KEY); LS.set('name',NAME); start(); }catch(err){ $('#gErr').textContent=err.message; }
});

function start(){ $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#who').textContent = NAME ? NAME+' さん' : ''; }

(async function init(){
  if(!KEY){ $('#gate').classList.remove('hidden'); return; }
  start();
  try{ const c=JSON.parse(localStorage.getItem('zn_cache')||'null'); if(c){ DB=c; DB.items.forEach(it=>it._n=norm([it['品名'],it['キーワード'],it['商品コード'],it['規格'],it['分類'],it['業者'],it['メモ']].join(' '))); renderAll(); } }catch(e){}
  try{ await load(); }catch(err){ toast('最新にできませんでした：'+err.message); if(/合言葉/.test(err.message)){ LS.set('key',''); location.reload(); } }
})();
</script>
</body>
</html>
